# Built-in token registry, keyed by chain ID then label name.
#
#   weth   the chain's wrapped native token (WETH, WBNB, WPOL, CELO, WOKB, WAVAX)
#   usdc   native Circle USDC. BSC (56) has none: there it is the 18-decimal
#          Binance-Peg USDC
#   usdce  bridged USDC, where it is a different contract from native USDC
#          (USDbC on Base, USDC.e elsewhere; on OP, Arbitrum and Polygon the
#          bridged contract's symbol() is plain "USDC")
#   usdt   Tether: issuer-native, USDT0, or the chain's canonical bridged token
#   dai    DAI, or its canonical bridged form (DAI.e on Avalanche)
#   wbtc   BitGo WBTC, or its canonical bridged form (WBTC.e on Avalanche)
#
# `symbol` and `decimals` are what the contract returns, not what the token
# is usually called: USDT is "USD₮0" on Arbitrum and 18 decimals on BSC.
# `source` is the issuer's or the chain's own address list. A token is
# listed only where such a list names it; `chainz doctor --tokens` checks
# every entry on chain (code present, symbol() and decimals() match), and
# every entry passed on 2026-11-11. Arc (5042) has no wrapped native token
# (USDC is native), so it has no weth entry.

