[package]
name = "chainz-core"
description = "Synchronous core of chainz: config, secrets, chain resolution, exec context, labels. Internal to chainz: no stable API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
chainz-os.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
toml_edit.workspace = true
toml.workspace = true
url.workspace = true
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha3.workspace = true
hex.workspace = true
dirs = "6"
zeroize.workspace = true
aes-gcm = "0.10"
argon2 = "0.5"
base64.workspace = true
rand.workspace = true
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "vendored"] }
tempfile = { workspace = true, optional = true }

[features]
# `testing`: helpers for other crates' tests (`MemoryKeyBackend`,
# `ForkRecord::sample`, `TempStore`). Never enabled by a release build.
testing = ["dep:tempfile"]

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
