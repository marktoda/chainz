[package]
name = "chainz"
description = "A local multichain workbench: chains, endpoints, signers, and exec with context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["ethereum", "evm", "foundry", "rpc", "cli"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies", "development-tools"]

[[bin]]
name = "chainz"
path = "src/main.rs"

[dependencies]
chainz-core.workspace = true
chainz-rpc.workspace = true
chainz-serve.workspace = true
chainz-tui.workspace = true
chainz-os.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
console = "0.16"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
rpassword = "7"
zeroize.workspace = true
indexmap.workspace = true
libc.workspace = true
tempfile.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
