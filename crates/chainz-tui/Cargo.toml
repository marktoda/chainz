[package]
name = "chainz-tui"
description = "The chainz top dashboard. Internal to chainz: no stable API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chainz-core.workspace = true
chainz-rpc.workspace = true
chainz-os.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"

[dev-dependencies]
chainz-testkit.workspace = true
chainz-serve = { workspace = true, features = ["testing"] }
tempfile.workspace = true
