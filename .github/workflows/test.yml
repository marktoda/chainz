on:
  push:
    branches:
      - main
  pull_request:

name: CI

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # v2 supports Linux and macOS only.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install strace (exec structural test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Install Foundry (anvil, for fork tests)
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --locked --workspace --all-targets
        env:
          CHAINZ_REQUIRE_TOOLS: "1"

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The tui's dev-dependency turns on chainz-serve/testing for the
      # whole workspace; lint the gateway as it ships, without it.
      - name: Run cargo clippy (chainz-serve without testing)
        run: cargo clippy --locked -p chainz-serve --lib -- -D warnings

      - name: Check rustdoc
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --locked --workspace --all-targets

  perf:
    name: Hot-path perf gate (v2 <= 85% of v1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # v1 is pinned to its last commit (c964bce, PR #14): main is v2 since
      # v2.0.0, and the v0.4.0 tag predates c964bce.
      - name: Checkout v1 (c964bce, last v1 commit)
        uses: actions/checkout@v4
        with:
          ref: c964bceb3cc028b342459418902a17cc853a8836
          path: v1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            v1

      - name: Build v1 and v2
        run: |
          cargo build --release --locked -p chainz
          cargo build --release --locked --manifest-path v1/Cargo.toml

      - name: Run perf gate
        run: scripts/perf-gate.sh v1/target/release/chainz target/release/chainz

      # Exits 1 when the gateway adds 1 ms or more to the p50 round trip
      # (measured: under 0.1 ms).
      - name: Gateway latency budget
        run: cargo run --release --locked -p chainz-serve --example latency

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify publishable packages
        run: cargo package --locked --workspace

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
