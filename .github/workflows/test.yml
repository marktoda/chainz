on:
  push:
    branches:
      - main
  pull_request:

name: CI

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # v2 supports Linux and macOS only.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install strace (exec structural test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Install Foundry (anvil, for fork tests)
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: scripts/check.sh test
        env:
          CHAINZ_REQUIRE_TOOLS: "1"

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run fmt, clippy and rustdoc
        run: scripts/check.sh lint

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --locked --workspace --all-targets

  perf:
    name: Hot-path perf gate (<= 85% of 0.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # The baseline is the last 0.4 commit (c964bce, PR #14, after the
      # v0.4.0 tag). Once 2.0.0 is published, compare against it instead.
      - name: Checkout 0.4 baseline (c964bce)
        uses: actions/checkout@v4
        with:
          ref: c964bceb3cc028b342459418902a17cc853a8836
          path: v1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            v1

      - name: Build 0.4 and this commit
        run: |
          cargo build --release --locked -p chainz
          cargo build --release --locked --manifest-path v1/Cargo.toml

      - name: Run perf gate
        run: scripts/perf-gate.sh v1/target/release/chainz target/release/chainz

      # Exits 1 when the gateway adds 1 ms or more to the p50 round trip
      # (measured: under 0.1 ms).
      - name: Gateway latency budget
        run: cargo run --release --locked -p chainz-serve --example latency

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify publishable packages
        run: cargo package --locked --workspace

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
