on:
  push:
    branches:
      - main
  pull_request:

name: CI

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # v2 supports Linux and macOS only.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install strace (exec structural test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Install Foundry (anvil, for fork tests)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --locked --workspace --all-targets
        env:
          CHAINZ_REQUIRE_ANVIL: "1"

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check rustdoc
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --locked --workspace --all-targets

  perf:
    name: Hot-path perf gate (v2 <= 85% of v1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Checkout v1 (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: v1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            v1

      - name: Build v1 and v2
        run: |
          cargo build --release --locked -p chainz
          cargo build --release --locked --manifest-path v1/Cargo.toml

      - name: Run perf gate
        run: scripts/perf-gate.sh v1/target/release/chainz target/release/chainz

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify publishable packages
        run: cargo package --locked --workspace

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
