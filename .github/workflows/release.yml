name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest
    environment: release
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        shell: bash
        run: |
          tagged_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          git merge-base --is-ancestor "${tagged_commit}" origin/main || {
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main" >&2
            exit 1
          }

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "chainz") | .version')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          }

      - name: Verify CHANGELOG.md has this version's notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Install strace (exec structural test)
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Verify release candidate
        # Fork tests skip here, each printing SKIPPED (no anvil): this job
        # holds the publish token, so it installs no extra third-party
        # actions. CI on main runs them with CHAINZ_REQUIRE_TOOLS=1.
        run: scripts/check.sh test

      - name: Verify package contents
        run: cargo package --locked --workspace

      - name: Publish to crates.io
        run: cargo publish --locked --workspace

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "chainz ${GITHUB_REF_NAME#v}" --notes-file "${RUNNER_TEMP}/notes.md"
