[workspace]
resolver = "3"
members = [
    "crates/chainz-os",
    "crates/chainz-core",
    "crates/chainz-rpc",
    "crates/chainz-serve",
    "crates/chainz-tui",
    "crates/chainz",
    "crates/chainz-testkit",
]
default-members = ["crates/chainz"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/marktoda/chainz"
license = "MIT"

[workspace.dependencies]
chainz-os = { path = "crates/chainz-os", version = "2.0.0" }
chainz-core = { path = "crates/chainz-core", version = "2.0.0" }
chainz-rpc = { path = "crates/chainz-rpc", version = "2.0.0" }
chainz-serve = { path = "crates/chainz-serve", version = "2.0.0" }
chainz-tui = { path = "crates/chainz-tui", version = "2.0.0" }
# Unpublished; dev-dependencies only (no version, so `cargo package` drops it).
chainz-testkit = { path = "crates/chainz-testkit" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
toml_edit = { version = "0.25", features = ["serde"] }
# Fast read path; toml_edit stays for format-preserving writes.
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
bytes = "1"
url = "2"
tempfile = "3"
sha3 = "0.10"
hex = "0.4"
rand = "0.9"
zeroize = "1"
libc = "0.2"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
